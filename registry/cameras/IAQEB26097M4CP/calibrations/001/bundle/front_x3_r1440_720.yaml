%YAML:1.0
# Front-lens ORB-SLAM3 settings. The 1440 crop of the sample calibration, scaled to 720:
# f' = f/2, c' = (c - 0.5) / 2. KB4 distortion is unchanged. See software/trajectory/calibration.py.

File.version: "1.0"

Camera.type: "KannalaBrandt8"
Camera1.fx: 266.352024231707
Camera1.fy: 265.539475604532
Camera1.cx: 361.849229906428
Camera1.cy: 362.554875646235
Camera1.k1: 0.099254471908
Camera1.k2: -0.066223659700
Camera1.k3: 0.032530079472
Camera1.k4: -0.006847497849

Camera.width: 720
Camera.height: 720
Camera.fps: 30
Camera.RGB: 1

# camera -> body(IMU) = Basalt T_imu_cam as is (ORB-SLAM3 mTbc)
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [-0.000419390442, 0.999868630695, 0.016203254725, 0.004947579745,
          -0.002518402716, -0.016204260822, 0.999865530748, 0.002491871236,
          0.999996740874, 0.000378527727, 0.002524867787, 0.016418811229,
          0.000000000000, 0.000000000000, 0.000000000000, 1.000000000000]

IMU.NoiseGyro: 0.0002
IMU.NoiseAcc: 0.002
IMU.GyroWalk: 2e-05
IMU.AccWalk: 0.003
IMU.Frequency: 997.297324

ORBextractor.nFeatures: 1250
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

System.thFarPoints: 20.0

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
Viewer.imageViewScale: 1.0
