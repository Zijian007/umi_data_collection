# 环境海报的共享几何参数。
# 场景建图、场景任务融合、独立轨迹和标定 C 都从这里读取同一份默认值。
# collection.yaml.scene.tags 和 trajectory.environment_tags 只负责本次运行的策略覆盖。
tag_minimum_side_px: 8.0  # 单个环境标签的最短投影边长，单位 px。
tag_minimum_frames: 3  # 海报位姿估计至少需要的独立观测时刻数。
tag_corner_sigma_px: 1.0  # 标签角点基础像素标准差，单位 px。
tag_sigma_per_radius_px: 40.0  # 远离主点后的角点噪声增量系数，单位 px。
tag_huber: 1.345  # 标签角点鲁棒核阈值，作用于归一化残差。
tag_maximum_reprojection_rms_px: 5.0  # 海报角点重投影 RMS 上限，单位 px。
tag_maximum_position_std_m: 0.05  # 独立海报位置支持：固定海报/标定下的局部线性化标准差上限，m；不代表实际精度。
tag_maximum_rotation_std_deg: 5.0  # 独立海报位置支持：对应旋转标准差上限，deg。
tag_maximum_cull_fraction: 0.15  # 每手标签剔除预算，数量上限向上取整；VIO 多轮共用原始训练集的累计预算；0 关闭。
tag_minimum_retained_time_fraction: 0.8  # 剔除后至少保留原海报观测时间跨度的比例。
tag_rear_rotation_refinement_enabled: true  # 关闭后严格固定 rear 外参，不创建修正变量。
tag_rear_rotation_prior_sigma_rad: 0.2  # 沿用原有零均值旋转先验强度，rad；数值为实验默认值。
tag_rear_rotation_maximum_correction_deg: 5.0  # 修正角超限则拒绝融合，不能裁剪为上限后发布。
