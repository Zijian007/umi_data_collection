# 共享场景算法默认值：配对、预检、建图、放置、定位、融合、测量和诊断。
# 用户日常策略写在 collection.yaml；一次实验覆盖写在 --expert-config 的 parameters 下。
# 环境海报的共享几何数值位于 config/algorithms/environment_tags.yaml。

schema_version: 2  # 场景参数文件格式；内部算法快照仍使用规范化 schema 1。

pairing:  # 同一套装多路原片的候选配对规则。
  start_tolerance_s: 2.0  # 文件名起始时间允许的最大差值，单位 s。
  duration_tolerance_s: 1.0  # 同套装录像允许的最大时长差，单位 s。

preflight:  # 原片完整性和开头静止质量检查。
  min_duration_s: 3.0  # 原片允许进入流水线的最短有效时长，单位 s。
  static_window_s: 2.0  # 开头静止质量检查窗口，单位 s。
  max_static_gyro_rad_s: 1.0  # 静止窗口角速度 P95 上限，单位 rad/s。
  max_static_acc_dev_m_s2: 2.0  # 静止窗口加速度模长偏离重力的上限，单位 m/s²。
  max_static_acc_std_m_s2: 0.8  # 静止窗口加速度模长标准差上限，单位 m/s²。
  max_shutter_s: 0.020  # 快门时长中位数上限，单位 s。
  max_exposure_cv: 0.25  # 快门时长变异系数上限，无量纲。

mapping:  # 共享场景地图的米制尺度、惯性对齐和环境标签尺度证据。
  alignment:  # 视觉节点与 IMU 的尺度、重力和零偏对齐规则。
    node_dt_s: 0.25  # 对齐节点的最小时间间隔，单位 s。
    max_gap_s: 0.15  # 视觉中断超过此时长时不参与连续对齐，单位 s。
    minimum_nodes: 12  # 对齐至少需要的可靠视觉节点数。
    maximum_condition: 100000000.0  # 对齐设计矩阵允许的最大条件数。
    maximum_scale_relative_std: 0.2  # 米制尺度相对标准差上限，无量纲。
    gravity_tolerance_m_s2: 0.5  # 自由估计重力与参考重力允许的差值，单位 m/s²。
    maximum_rms_m: 0.05  # 对齐位置方程 RMS 上限，单位 m。
    maximum_acc_bias_m_s2: 2.0  # 对齐得到的加速度零偏分量上限，单位 m/s²。
  environment_tags:  # 建图阶段环境海报尺度证据；日常策略由 collection.yaml 控制。
    enabled: false  # 是否在建图阶段检测并记录环境海报观测。
    scale:  # 是否把海报尺度作为建图尺度修正证据。
      enabled: false  # 启用前必须同时启用 environment_tags.enabled。
    minimum_frames: 6  # 海报尺度估计至少需要的有效观测时刻数。
    minimum_motion_m: 0.15  # 看到海报期间建图镜头中心的最小移动范围，单位 m。
    minimum_board_extent_m: 0.08  # 海报角点在板面方向的最小跨度，单位 m。
    maximum_relative_std: 0.15  # 海报尺度相对标准差上限，无量纲。
    imu_std_floor: 0.03  # IMU 尺度不确定度地板，无量纲。
    tag_std_floor: 0.02  # 海报尺度不确定度地板，无量纲。
    compatibility_sigma: 3.0  # 两类尺度兼容性检查的标准差倍数。
    maximum_scale_difference: 0.20  # 海报尺度与 IMU 尺度相对差值上限，无量纲。

placement:  # 工作镜头地图到固定场景坐标的刚体放置。
  minimum_pose_pairs: 10  # 双镜头放置至少需要的共同位姿对数量。
  position_sigma_m: 0.015  # 放置位置观测标准差，单位 m。
  rotation_sigma_deg: 1.0  # 放置旋转观测标准差，单位 deg。
  maximum_rms_m: 0.05  # 放置位置 RMS 上限，单位 m。
  maximum_rotation_deg: 5.0  # 放置旋转 RMS 上限，单位 deg。

localization:  # 固定地图任务的双向定位、覆盖和连续性规则。
  bidirectional: true  # 正向定位有缺失时是否尝试反向补全。
  reverse_context_s: 1.0  # 反向处理缺口两侧附带的上下文，单位 s。
  minimum_overlap_frames: 3  # 正反向结果接受前必须共享的最少帧数。
  max_position_difference_m: 0.03  # 正反向共同帧位置差上限，单位 m。
  max_rotation_difference_deg: 3.0  # 正反向共同帧旋转差上限，单位 deg。
  minimum_fraction: 0.5  # 每只手获得地图位置约束的最低帧比例。
  maximum_visual_gap_s: 2.0  # 允许的最长连续无视觉时长，单位 s。

fusion:  # 固定场景任务的视觉融合权重和环境海报因子。
  environment_tags:  # 场景任务是否把环境海报角点加入视觉–IMU 图。
    enabled: false  # collection.yaml.scene.tags.fusion.enabled 会覆盖此默认值。
    method: staged  # staged：先地图+IMU再海报；joint：初值图直接联合地图、IMU和海报。
  front_position_sigma_m: 0.015  # 工作镜头位置观测标准差，单位 m。
  rear_position_sigma_m: 0.020  # 环境镜头位置观测标准差，单位 m。
  visual_rotation_sigma_deg: 1.0  # 视觉旋转观测标准差，单位 deg。
  huber: 2.5  # 视觉残差的 Huber 阈值，作用于归一化残差。

measurements:  # 夹爪标签中心距和开口宽度测量。
  gripper_tags:  # 两枚夹爪标签中心距的几何质量规则。
    roi_px: [600, 980, 1350, 1250]  # 原始工作镜头半幅 LEFT TOP RIGHT BOTTOM，单位 px。
    max_reprojection_error_px: 2.0  # 标签角点重投影 RMS 上限，单位 px。
    max_center_ambiguity_mm: 2.0  # 平面两解中心距离超过此值才接受，单位 mm。
    minimum_valid_fraction: 0.5  # 有效中心距帧的最低比例。
    max_missing_frames: 15  # 允许连续缺失的最大输出帧数。
  gripper_width:  # 夹爪开口宽度和闭合状态的后处理规则。
    max_gap_s: 0.2  # 宽度缺口允许插值的最大间隔，单位 s；0 表示不插值。
    closed_threshold_mm: 3.0  # 判断夹爪闭合的宽度阈值，单位 mm。

diagnostics:  # 只影响诊断产物，不增加轨迹约束。
  gripper_width: false  # 是否输出夹爪标签逐帧宽度诊断 CSV。
  export_auxiliary_trajectories: false  # 是否导出可由 TCP 和外参重建的相机/IMU TUM 轨迹。
