# 执行预算；这些值影响资源使用和超时，不进入算法结果身份。
# 单次运行可用 --cores、--jobs、--workers 或 UMI_OPENCV_THREADS 调整，不需要改本文件。
decode_threads: 8  # 每路视频的解码线程数。
opencv_threads: 4  # 场景运行时 OpenCV 线程数。
calibration_opencv_threads: 1  # 标定/诊断 OpenCV 线程数，避免帧间并行产生嵌套线程。
calibration_max_workers: 24  # 标定自动 worker 数量上限。
calibration_reserved_cpus: 1  # 自动分配标定 worker 时预留的 CPU 数量。
calibration_bag_threads: 4  # 标定 bag 转换阶段的线程数上限。
arm_min_cpus: 4  # 双手并行处理时每只手所需的最低 CPU 数量。
slam_timeout_base_s: 300  # 每次 SLAM 运行的基础超时时间，单位 s。
slam_timeout_per_30_frames_s: 16  # 每 30 帧额外增加的 SLAM 超时时间，单位 s。
map_export_timeout_s: 180  # 地图导出和转换的超时时间，单位 s。
