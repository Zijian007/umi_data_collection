# 本机通用偏好；在此修改功能和并发设置。
schema_version: 2  # 通用偏好格式版本。

features:
  audio_sync:
    enabled: true  # true=估计双手音频偏移，false=假设同时开始。
  factory_intrinsics:
    enabled: false  # true=全部使用 factory，false=沿用 kit 的逐镜头来源。

runtime:
  parallel_tasks:
    enabled: false  # 开启后可同时执行多个 take。
    jobs: 1  # 任务并发数；仅在并发开启时使用。
  cores: auto  # 可用 CPU 由进程 affinity 决定，也可写成 "0-3,8"。
