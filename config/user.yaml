# 本机通用偏好；在此修改功能和并发设置。
schema_version: 2  # 通用偏好格式版本。

features:
  audio_sync:
    enabled: true  # true=估计双手音频偏移，false=假设同时开始。
    algorithm: specialist  # specialist=音量包络互相关，kiwi=频谱指纹与 GCC-PHAT。
  factory_intrinsics:
    enabled: false  # true=全部使用 factory，false=沿用 kit 的逐镜头来源。

reconstruction:
  backend:
    mode: auto  # auto / scene_map / poster_vio / poster_independent。
    poster_vio:
      # initialization:
      #   robust_inertial_seed: true  # 省略时继承项目默认值。
      base_tag:
        enabled: true  # true=允许使用 kit 中的基座标签，false=关闭这项约束。
  map:
    layout: auto  # auto=按录像推断，shared=共享地图，per_arm=分手建图。
    reference_arm: left  # 多路建图的参考手，可填 left 或 right。

# measurements:
#   gripper_tags:
#     verified_gap_recovery: true  # 省略时继承项目默认值。

runtime:
  parallel_tasks:
    enabled: false  # 开启后可同时执行多个 take。
    jobs: 1  # 任务并发数；仅在并发开启时使用。
  cores: auto  # 可用 CPU 由进程 affinity 决定，也可写成 "0-3,8"。
