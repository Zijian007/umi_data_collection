# 用户偏好的唯一默认值；日常覆盖写入 user.yaml，不在这里维护本机选择。
schema_version: 2  # 用户偏好格式；固定为整数 2，不是调参项。
features:  # 通用功能偏好；省略的功能沿用本文件默认值。
  audio_sync:  # 双手任务未声明 synchronization 时使用的同步策略。
    enabled: false  # true=默认 audio_auto；false=默认假设同时开始；任务显式声明优先。
  factory_intrinsics:  # 全局镜头来源覆盖，会影响后续所有批次的两个镜头。
    enabled: false  # true=两镜头统一选择 factory；false=沿用各 kit 的 measured/factory 选择。
runtime:  # 本机 CPU 与任务并发偏好；命令行显式值优先。
  parallel_tasks:  # 多个 take 的并发；不控制一个 take 内的双手并行。
    enabled: false  # 候选 true / false；false 强制每次一个任务，true 使用 jobs。
    jobs: 1  # 并发任务数；整数 >=1，仅 enabled:true 时生效，CLI --jobs 优先。
  cores: auto  # 候选 auto 或 CPU 编号/范围字符串，如 "0-3,8"；auto 使用进程可用 CPU，CLI --cores 优先。
viewer:  # 查看器监听覆盖；null 表示沿用 operations/viewer[.local].yaml。
  host: null  # null 或非空监听地址字符串，如 127.0.0.1、0.0.0.0；后者允许远程访问，CLI --host 优先。
  port: null  # null 或整数 0–65535；null 继承查看器默认，0 自动分配空闲端口，CLI --port 优先。
