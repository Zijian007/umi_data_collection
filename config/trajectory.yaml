# 轨迹参数：按输入 → 镜头视频 → 建图/定位 → 重试 → IMU 融合 → 静止约束 → 提醒阅读。
# 原始 INSV 只裁切一次；每轮重建依次执行“建图 → 逐图定位 → IMU 融合”。
# 下方 sigma 表示标准差：通常调小使对应约束更强，调大使其更宽松；协方差另有注明。
# “链”是连续跟踪的一段视觉观测；“分段”是在链内进一步划分的尺度/放置单元。
# “锚定段”是用来固定本段世界坐标参考的分段，原点和水平朝向并非外部绝对坐标。
# 配置覆盖、结果快照及复用规则见 config/README.md。

# 配置结构版本，用于加载器检查字段格式；不是算法调参项。
schema_version: 1

input:
  # handheld：前镜头 + IMU；dual：前/后镜头 + IMU。
  # dual 当前仍使用后镜头样例几何，不能视为本设备已完成双镜头独立标定。
  mode: "handheld"

  # 是否接受帧时间不规则的录像；true 会将真实帧时间传给融合，false 默认拒绝。
  # 这条处理路径尚未验证；开启不等于修复丢帧，也不会补出缺失画面。
  allow_irregular: false

# 镜头视频尺寸和编码；原片模式、1440×1440 中心裁切与每两帧取一帧由相机规格固定。
video:
  # 输出正方形视频的边长，单位像素；默认 720，即从 1440×1440 裁切图缩小到 720×720。
  # 必须为 2–1440 的偶数；同时调整前/后镜头视频、SLAM 内参和遮手图，视野、畸变和帧率不变。
  # 调大通常增加细节和计算量；过小可能无法稳定提取特征。默认以外的尺寸需验证轨迹质量。
  size_px: 720

  # x264 质量参数，范围 0–51；越小压缩损失越少、文件通常越大，0 为无损模式。
  # 此视频直接用于建图和定位，因此改变画质可能影响提取到的视觉特征。
  crf: 10

  # x264 编码速度/压缩效率档位；越靠 slow/veryslow 通常越慢、压缩效率越高。
  # 它不控制视频播放速度或算法帧率；同一 CRF 下也不保证所有编码结果完全相同。
  preset: "medium"

# ORB-SLAM3：用于每个镜头的建图与逐图定位。IMU 融合参数在后面的 fusion。
orb:
  # 常规 ORB 提取器每帧的目标特征数；增大通常提高计算量，实际数量仍取决于图像。
  features: 1250

  # 图像金字塔相邻层的缩放因子，必须 > 1；越接近 1，尺度采样越密。
  # 与 levels 一起决定尺度覆盖范围，不能单独理解为“越小越准”。
  scale_factor: 1.2

  # 金字塔层数；增大可覆盖更大尺度变化，也通常增加特征提取开销。
  levels: 8

  # 首次检测 FAST 角点的阈值；调高更严格，弱纹理区域可能找不到足够角点。
  initial_fast: 20

  # 局部角点不足时重试 FAST 的较低阈值；必须 <= initial_fast。
  # 调低会保留更多弱角点，但也可能增加不稳定特征。
  minimum_fast: 7

  # ORB 过滤远处地图点的距离阈值；单目阶段使用地图单位，不能直接当成真实米数。
  # 调大允许保留更远的点；当前配置校验要求此值 > 0。
  far_points_map_units: 20.0

  # OpenCV 的标记字典编号；20 对应 DICT_APRILTAG_36h11，须与初始化标签匹配。
  # 此处是轨迹引擎的标签辅助初始化，与标定的整块 AprilGrid 检测参数分开。
  aruco_dictionary: 20

  # 普通两视图初始化失败、尝试标签辅助初始化时使用的标签 ID；不表示每帧必须看到此标签。
  initial_tag_id: 13

  # 上述初始化标签的实际边长，单位 m；0.024 即 24 mm，应匹配真实标签尺寸。
  # 它不是通用的轨迹尺度修正旋钮，也不会替代相机标定或后续 IMU 尺度恢复。
  initial_tag_size_m: 0.024

# 重试条件影响实际采用哪一轮结果，属于计算参数。覆盖率不是实测精度。
retry:
  # 完整重建的总尝试次数上限，包含第一次；1 表示不重试，不是“再重试一次”。
  # 执行失败或质量可疑时才继续；一旦满足质量条件就提前结束。
  max_tries: 3

  # 地图位置约束覆盖帧比例的下限，范围 0–1；0.95 即 95%。
  # 低于此值触发下一轮（若还有次数）；调大更容易重试，不会直接让轨迹更准确。
  minimum_full_fraction: 0.95

  # 可接受的独立地图放置数上限；超过则尝试重建，数量按融合链及分组统计。
  # 多轮有效结果优先选放置数少的，再选覆盖率高的；耗尽次数仍会选最佳有效结果。
  maximum_placements: 1

# IMU 融合：先线性恢复各链的米制尺度和重力，再优化位姿、速度、bias 及地图放置。
fusion:
  # 世界坐标系的重力大小，单位 m/s²；方向为 -Z。
  # 这是融合的物理参考，不是给最终轨迹乘的缩放系数。
  gravity_m_s2: 9.81

  # 线性对齐时，相邻位姿采样端点的间隔，单位为处理后的帧（约 29.97 帧/s）。
  # 30 约为 1 s；调大使对齐区间更长、同一链可提供的区间对数更少，不改变输出帧率。
  step: 30

  # 非线性图中每隔多少帧设置位姿/速度/bias 节点；中间帧通过 IMU 补全。
  # 调大通常减少计算量，但节点更稀疏；不表示每隔这么多帧才输出一个轨迹点。
  node_stride: 5

  # 视觉位置观测的基础标准差，单位 m；调小更信任视觉位置，调大允许更大视觉残差。
  # adaptive_sigma 可按镜头放大该值；map_residual 开启后还会换算到地图单位。
  position_sigma_m: 0.004

  # 一条位置链内部再划分分段的时长，单位 s；0 表示整条链用一个分段。
  # 正值允许不同分段的尺度/放置变化，并通过连续性因子相连；过短会增加变量和计算量。
  segment_s: 0.0

  # 同一链相邻分段 log(scale) 差的标准差，无量纲；0.03 约对应 3% 的相对尺度变化。
  # 越小越限制分段之间的尺度漂移；只有实际产生相邻分段时才起作用。
  continuity_log_scale_sigma: 0.03

  # 相邻分段旋转连续性的标准差，单位 °；越小越约束边界处的旋转变化。
  continuity_rotation_sigma_deg: 0.3

  # 相邻分段在共同边界地图点处的位置连续性标准差，单位 m；越小越限制边界跳变。
  continuity_position_sigma_m: 0.002

  # 将链接受为可提供位置约束时，尺度估计相对标准差的上限，无量纲。
  # 0.2 即标准差不超过尺度绝对值的 20%；调小会让更多链只能提供旋转信息。
  maximum_relative_scale_std: 0.2

  # 双镜头时，另一镜头链与初始镜头参考对齐后的位置 RMS 上限，单位 m。
  # 超过则不使用该链的位置约束；若旋转检查通过，仍可只保留旋转约束。
  other_lens_rms_m: 0.05

  # 双镜头时，另一镜头链与初始镜头参考的旋转差中位数上限，单位 °。
  # 超过则整条链不参与融合；调大更宽松，但可能引入不一致的观测。
  other_lens_rotation_deg: 1.0

  # 可优化镜头杆臂的初值先验标准差，单位 m；杆臂是相机系中从相机到 IMU 的位移。
  # 后镜头参与位置融合时会优化杆臂；前镜头仅在 optimize_front_lever 开启时优化。
  lever_sigma_m: 0.01

  # 是否在融合中优化前镜头杆臂；false 固定使用选中的相机标定值。
  # true 允许围绕标定初值调整，但不会把本次估计写回设备标定包。
  optimize_front_lever: false

  # 相邻视觉帧的相对旋转与陀螺仪积分旋转差超过此角度时断链，单位 °。
  # 调小更容易断链；0 只关闭此角度判据，跟踪中断/地图标签变化仍会断链。
  split_rotation_deg: 15.0

  # 失败链细分的规模参数 W，单位为 step 定义的运动区间对数，不是最大重试次数。
  # 失败链达到 2W 对时先独立检查，仍失败才二分；调大只处理更长的失败链，0 关闭细分。
  refine_chain_pairs: 8

  # 同一地图中两条位置链允许共享放置的尺度比容差，无量纲。
  # 1.25 表示两者尺度之比必须严格落在 1/1.25 与 1.25 之间；调大更容易合并。
  # 0 或 1 均不启用分组；其余有效值必须 > 1。
  group_scale_ratio: 1.25

  # 是否按各镜头线性对齐的位置 RMS 自动放大较差镜头的位置 sigma。
  # 这是按镜头整体调权，不是逐帧调权；仅一个镜头提供位置时，倍率为 1。
  adaptive_sigma: true

  # true：在地图坐标中计算视觉位置残差，sigma 按初始尺度换算；false：在米制世界坐标中计算。
  # 这改变残差模型，并非仅切换输出坐标；两种设置的输出仍是米制轨迹。
  map_residual: true

  # IMU 测量噪声与 bias 随机游走：与标定文件中的同名先验分开设置，不会自动从标定 JSON 继承。
  # 加速度测量噪声密度，(m/s²)/√Hz；调大降低对 IMU 加速度约束的信任。
  acc_noise: 0.002

  # 角速度测量噪声密度，(rad/s)/√Hz；调大降低对陀螺仪约束的信任。
  gyro_noise: 0.0002

  # 加速度 bias 随机游走强度，(m/s²)/√s；调大允许相邻图节点的零偏变化更多。
  acc_bias_rw: 0.003

  # 陀螺仪 bias 随机游走强度，(rad/s)/√s；调大允许角速度零偏变化更多。
  gyro_bias_rw: 0.00002

  # GTSAM 预积分中位置积分误差的协方差系数，沿用求解器的连续时间约定。
  # 直接乘单位矩阵，不会再平方；它是协方差，不是像其他 sigma/noise 一样的标准差。
  integration_covariance: 0.00000001

  # 视觉位姿和仅旋转观测的 Huber 鲁棒核阈值，作用于按噪声归一化后的残差，无量纲。
  # 调小更早降低大残差的权重；不是米或度的误差上限，也不改变 IMU/分段连续性因子。
  huber: 1.345

  # 视觉姿态观测的旋转标准差，单位 °；同时用于完整位姿观测和仅旋转观测。
  # 调小更信任视觉姿态，调大更依赖其他约束协调姿态。
  visual_rotation_sigma_deg: 0.5

  # 图优化初值先验：约束变量偏离线性阶段初值的程度，不是最终误差容许值。
  # 每条位置链首段 log(scale) 初值的标准差，无量纲；调小更限制尺度偏离初值。
  # 0.5 不是直接的“50% 尺度误差上限”。
  scale_prior_sigma: 0.5

  # 锚定参考段的初始旋转先验标准差，单位 rad；调小更牢地固定世界坐标参考姿态。
  gauge_rotation_sigma_rad: 0.05

  # 非锚定位置链首段的地图旋转初值先验标准差，单位 rad。
  rotation_prior_sigma_rad: 0.5

  # 锚定参考段的地图平移初值先验标准差，单位 m；用于固定世界坐标原点附近的位置。
  gauge_position_sigma_m: 0.001

  # 非锚定位置链首段的地图平移初值先验标准差，单位 m；调大允许放置调整更多。
  position_prior_sigma_m: 1.0

  # 第一个图节点加速度 bias 初值的先验标准差，单位 m/s²；调小更限制偏离线性估计初值。
  acc_bias_prior_sigma: 0.1

  # 第一个图节点陀螺仪 bias 初值的先验标准差，单位 rad/s；与后面的静止均值初始化配合。
  gyro_bias_prior_sigma: 0.01

  # 第一个图节点速度初值的先验标准差，单位 m/s；初值由初始位置轨迹的差分估计。
  velocity_prior_sigma_m_s: 0.5

  # 线性对齐、初始 bias 估计和链质量筛选。
  # 从全段原始 IMU 中筛选“角速度模长小于此值”的样本，用于估计初始陀螺仪 bias，单位 rad/s。
  # 调大更容易把轻微运动也纳入静止样本；这一步与下面的 ZUPT 检测不同。
  initial_static_gyro_rad_s: 0.02

  # 估计初始陀螺仪 bias 时最多使用的静止样本数，按时间顺序取最先满足条件的这些样本。
  initial_bias_max_samples: 2000

  # 全段符合上述静止条件的样本数必须严格大于此值，才采用静止均值作为初始 gyro bias。
  # 不足则从零 bias 开始；此值必须 <= initial_bias_max_samples。
  initial_bias_min_samples: 200

  # 单镜头一次线性对齐至少需要的运动区间对数；区间长度由 step 决定，不是原始 IMU 样本数。
  # 不足时该次对齐返回无解；调大需要更多运动证据。
  minimum_alignment_pairs: 5

  # 一条链要被接受为可提供位置约束，至少需要的运动区间对数；同时还要通过尺度/重力检查。
  minimum_chain_pairs: 3

  # 自由估计的重力模长与 gravity_m_s2 之差的允许上限，单位 m/s²。
  # 超过时该链不能通过线性位置质量检查；不是 D 段的重力验收门限。
  gravity_tolerance_m_s2: 0.5

  # 优先选择初始镜头时，加速度 bias 各分量绝对值的上限，单位 m/s²。
  # 用于候选优先级；没有这类候选时还有回退选择，不是超过即让整段失败的硬门限。
  maximum_acc_bias_m_s2: 1.0

  # 双镜头时，另一镜头链与初始镜头的已放置参考至少需要共享多少帧，才尝试对齐。
  # 调大需要更多共同证据，但可能舍弃短链；单镜头模式不使用此门限。
  minimum_common_frames: 10

  # 非线性 LM 图优化的最大迭代次数；增大只提高迭代上限，不保证精度提升。
  lm_iterations: 100

  # 线性对齐 LSQR 的最大迭代次数；用于求尺度、重力、bias 和初始速度等。
  linear_iterations: 50000

  # 线性 LSQR 同时使用的 atol / btol 相对停止容差，无量纲。
  # 调小要求更严格的收敛，可能更慢；不是米制轨迹误差阈值。
  linear_tolerance: 0.000000000001

# ZUPT：从 IMU 静止窗口识别近零速度，在对应图节点加入零速度先验。
zupt:
  # 是否启用静止时的零速度约束；只表示算法是否添加此类先验，不意味着录像必须有静止段。
  enabled: true

  # 每个视频时刻前后各取多长的 IMU 窗口，单位 s；0.25 表示总长约 0.5 s。
  # 调大要求更长时间持续静止；与 D 的非重叠窗口不同，这里围绕每一帧滑动检查。
  half_window_s: 0.25

  # 窗口 IMU 样本数必须严格大于此值，才进行静止判定；注意与 D 的“至少”条件不同。
  minimum_samples: 20

  # 去掉初始 gyro bias 后，窗口内角速度模长的最大值必须小于此值，单位 rad/s。
  # 调小更严格；过宽可能把慢速运动也判为静止。
  maximum_gyro_rad_s: 0.03

  # 窗口内原始加速度模长的标准差必须小于此值，单位 m/s²；调小排除更多抖动窗口。
  maximum_acc_norm_std_m_s2: 0.08

  # 识别为静止后，零速度先验的标准差，单位 m/s；调小更强地把对应图节点速度拉向零。
  velocity_sigma_m_s: 0.01

# 下面只生成质量提醒，不改变轨迹、不触发重试，也不能代替独立真值误差评估。
# retry.minimum_full_fraction 与这里的同名参数作用不同。
notes:
  # 有地图位置约束的帧比例低于此值时提醒，范围 0–1；0.5 即 50%。
  # 完全没有地图位置约束时始终有单独提醒，与此阈值无关。
  minimum_full_fraction: 0.5

  # 从开头到第一帧获得地图位置约束的时间超过此值时提醒，单位 s。
  # 表示开头有较长 IMU 桥接区间，不表示这一段实测误差有多少。
  maximum_leading_imu_s: 5.0

  # 建图日志中记录的跟踪成功帧比例低于此值时提醒，范围 0–1。
  # handheld 对应前镜头；dual 当前取最后一条同名建图统计，通常对应后镜头。
  # 它不是后续逐图定位成功率，也不是上面的地图位置约束覆盖率。
  minimum_mapping_fraction: 0.5
