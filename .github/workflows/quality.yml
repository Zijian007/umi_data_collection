name: UMI quality

on:
  push:
  pull_request:

jobs:
  portable-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install portable reader dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.* ruff==0.15.0 import-linter==2.15

      - name: Compile Python sources
        run: python -m compileall -q umi tests

      - name: Check portable training reader boundary
        run: PYTHONPATH=. python -m unittest -q tests.test_dataset_reader_boundary

      - name: Lint the umi package
        run: ruff check umi

      - name: Check package layering
        run: PYTHONPATH=. lint-imports --config .importlinter
