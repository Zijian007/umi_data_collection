name: UMI quality

on:
  push:
  pull_request:

jobs:
  portable-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install portable reader dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.* ruff==0.15.0

      - name: Compile Python sources
        run: python -m compileall -q software tests

      - name: Check portable training reader boundary
        run: PYTHONPATH=. python -m unittest -q tests.test_dataset_reader_boundary

      - name: Run changed-source lint rules
        run: >-
          ruff check
          software/dataset/reader.py
          software/dataset/schema.py
          software/dataset/sampling.py
          software/dataset/export.py
          software/scene/cli.py
          software/scene/arms.py
          software/scene/spatial/poster.py
          software/trajectory/algorithms/fusion/graph.py
          software/trajectory/poster_vio/models.py
          software/trajectory/poster_vio/contract.py
          software/trajectory/poster_vio/quality.py
          software/trajectory/poster_vio/initialization.py
          software/trajectory/poster_vio/frontend.py
          software/trajectory/poster_vio/solver.py
          software/trajectory/poster_vio/base_tags.py
          software/trajectory/poster_vio/refinement.py
          software/trajectory/poster_vio/feature_geometry.py
          software/trajectory/poster_vio/keyframes.py
          software/scene/pipeline/tasks/backends/poster_vio.py
          software/scene/pipeline/tasks/backends/poster_vio_inputs.py
