kit: kit_001  # kits/ 下已有套件目录名。

recording:
  arms: [left, right]  # [left] | [right] | [left, right]：本批次预期采集的手。

scene:
  description: test shelf  # 场景描述文本。

environment_poster:
  layout_path: ../../hardware/calibration_targets/environment_poster.json  # 海报布局 JSON 路径。
  detection:
    enabled: true  # true | false：环境海报检测总开关。
  task_constraint:
    enabled: true  # true | false：任务融合是否使用海报约束。
    method: staged  # staged | joint；仅 scene_map 使用。

reconstruction:
  backend: poster_vio  # scene_map | poster_independent | poster_vio | auto。
