# 复制到 scenes/<scene>/<batch>/collection.yaml；示例文件不会被自动发现。
kit: kit_001

recording:
  arms: [left, right]         # 必填；批次默认使用手

scene:
  description: example scene

map:
  layout: auto                 # auto | shared | per_arm
  reference_arm: left          # left | right
  selection:
    policy: latest_prior       # 当前只能是 latest_prior
    version: null              # null 或已发布地图版本 ID

environment_poster:
  layout_path: ../../hardware/calibration_targets/environment_poster.json
  # scene_map 需要海报融合时再声明用途，检测会随用途自动开启：
  # task_constraint:
  #   enabled: true
  #   method: staged
  # mapping:
  #   enabled: true
  #   scale_correction:
  #     enabled: true
  # poster_vio / poster_independent / auto 只需 layout_path，无需重复开启用途。

reconstruction:
  backend: scene_map            # scene_map | poster_independent | poster_vio | auto

tasks:
  take_001:
    instruction: 拿起物体并放到指定位置
    # arms: [right]           # 省略继承批次；仅需单手时覆盖
    synchronization:
      mode: assumed_simultaneous # audio_auto | assumed_simultaneous | manual
    # reconstruction:
    #   backend: poster_independent
    # map:
    #   epoch: epoch_001
    #   version: 20261113_100000-a1b2c3d4
