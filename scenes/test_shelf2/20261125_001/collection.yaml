kit: kit_001  # hardware/kits/<名称>/kit.yaml 的目录名；定义设备和夹爪资产。
arms: [left, right]  # 本批次使用手；任务可覆盖为子集，缺片不会自动变单手。
description: test shelf  # 场景描述；身份来自目录名。

sync:  # 双手任务默认同步方式；任务可用 tasks.<take>.sync 覆盖。
  mode: audio_auto  # audio_auto=从录音估计偏移；assumed_simultaneous=按同时开始。
  algorithm: kiwi  # specialist=音量包络互相关（项目默认）；kiwi=频谱指纹投票 + GCC-PHAT 精对齐。

poster:  # 场景中的环境海报；各阶段是否使用由 map.poster_scale、backend 决定。
  layout: ../../hardware/environment_poster/environment_poster.json  # 相对 scenes/<scene>/，也可绝对路径。
  detection: true  # 运行海报检测；false 会与海报后端冲突。

backend:  # 批次默认后端；tasks.<take>.backend 可覆盖。
  mode: auto  # scene_map / poster_independent / poster_vio / auto。
  auto_order: [poster_vio, poster_independent, scene_map]  # 轮到 scene_map 时才准备地图。
  scene_map:
    poster_constraint: staged  # staged=地图与 IMU 基线后优化；joint=视觉种子联合优化；off=不用海报。
  poster_vio:
    base_tag: false  # 此批次关闭夹爪基座标签约束。
    robust_inertial_seed: true  # 重力或零偏超限时尝试鲁棒惯性初始化。

measurements:
  gripper_tags:
    verified_gap_recovery: true  # 常规测距超出缺口上限时，用原片增强和双向模板补检。
